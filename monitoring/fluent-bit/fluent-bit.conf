[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# Turn the JSON text inside "log" into real fields (Nginx and API lines).
[FILTER]
    Name           parser
    Match          *
    Key_Name       log
    Parser         json
    Reserve_Data   On
    Preserve_Key   Off

# Make sure every record has a "service" field.
[FILTER]
    Name    lua
    Match   *
    script  /fluent-bit/etc/add_service.lua
    call    add_service

[OUTPUT]
    Name    stdout
    Match   *
    Format  json_lines
